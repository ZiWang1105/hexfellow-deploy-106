workspace: ${oc.env:HEXFELLOW_WORKSPACE}
output: ${oc.env:HEXFELLOW_OUTPUT}
topic_prefix: ${oc.env:HEXFELLOW_TOPIC_PREFIX}
policy:
  agent_config: configs/agent/rgbd_full.yaml
  model: openai/gpt-6-astra
  reasoning_effort: medium
timing:
  control_period_s: 0.02
  compute_budget_s: 0.006
  feedback_health_timeout_s: 0.1
topics:
  request:
    _target_: hexfellow_deploy.topics.JsonTopic
    prefix: ${topic_prefix}
  status:
    _target_: hexfellow_deploy.topics.JsonTopic
    prefix: ${topic_prefix}
  measured:
    _target_: hexfellow_deploy.control_topics.MeasuredTopic
    prefix: ${topic_prefix}
  plant_state:
    _target_: hexfellow_deploy.topics.JsonTopic
    prefix: ${topic_prefix}
  decision:
    _target_: hexfellow_deploy.topics.JsonTopic
    prefix: ${topic_prefix}
  health:
    _target_: hexfellow_deploy.topics.JsonTopic
    prefix: ${topic_prefix}
  images:
    _target_: hexfellow_deploy.topics.RGBDTopic
    prefix: ${topic_prefix}
    width: 640
    height: 360
  frames:
    _target_: hexfellow_deploy.control_topics.ReferenceTopic
    prefix: ${topic_prefix}
  feedback:
    _target_: hexfellow_deploy.control_topics.FeedbackTopic
    prefix: ${topic_prefix}
  receipts:
    _target_: hexfellow_deploy.control_topics.ReceiptTopic
    prefix: ${topic_prefix}
  backend_status:
    _target_: hexfellow_deploy.topics.JsonTopic
    prefix: ${topic_prefix}
interface:
  control:
    _target_: hexfellow_deploy.components.ControlComponent
    name: hexfellow_control
    request: ${topic:request}
    status: ${topic:status}
    workspace: ${workspace}
    output: ${output}
    startup_carry: true
    period_s: ${timing.control_period_s}
    time_budget: ${timing.compute_budget_s}
    health_timeout_s: ${timing.feedback_health_timeout_s}
    inject_every: 0
    inject_delay_s: 0.0
    frames: ${topic:frames}
    feedback: ${topic:feedback}
    backend_status: ${topic:backend_status}
    receipts: ${topic:receipts}
  dashboard:
    _target_: hexfellow_deploy.dashboard.DashboardComponent
    name: hexfellow_dashboard
    status: ${topic:status}
    decision: ${topic:decision}
    images: ${topic:images}
    health: ${topic:health}
    backend_status: ${topic:backend_status}
    output: ${output}
    port: 8765
  camera:
    _target_: hexfellow_deploy.camera.SimulationCamera
    name: hexfellow_camera
    plant_state: ${topic:plant_state}
    images: ${topic:images}
    workspace: ${workspace}
    output: ${output}
    scene: ${interface.backend.scene}
    fps: 15
  backend:
    _target_: hexfellow_deploy.backend.BackendComponent
    name: hexfellow_backend
    workspace: ${workspace}
    output: ${output}
    deployment_config: ${deployment_config}
    scene: configs/scenes/apple_on_table.yaml
    backend: simulation
    execute: false
    submit_delay_s: 0.0
    command_timeout_s: 0.1
    feedback_timeout_s: ${timing.feedback_health_timeout_s}
    frames: ${topic:frames}
    feedback: ${topic:feedback}
    backend_status: ${topic:backend_status}
    measured: ${topic:measured}
    plant_state: ${topic:plant_state}
    control_status: ${topic:status}
    receipts: ${topic:receipts}
preprocess: {}
input: {}
inference: {}
output_components: {}
affinities: {}
python_scheduling:
  hexfellow_control:
    gil_switch_s: 0.0002
    cyclic_gc: false
  hexfellow_backend:
    gil_switch_s: 0.0002
    cyclic_gc: false
deployment_config: configs/local/desktop.yaml
