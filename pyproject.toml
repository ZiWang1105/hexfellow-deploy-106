[build-system]
requires = ["setuptools>=68,<82", "wheel", "pybind11>=2.11,<4", "hpp-fcl==2.4.4"]
build-backend = "setuptools.build_meta"

[project]
name = "hexfellow-deploy"
version = "0.1.0"
description = "Owned robot control, shared-memory runtime, simulation and calibration for Hexfellow"
requires-python = ">=3.10"
dependencies = ["hydra-core>=1.3,<2", "posix_ipc>=1.1", "numpy>=1.26,<2", "PyYAML>=6", "rich>=13", "typing_extensions>=4", "log-throttling"]

[project.scripts]
hexfellow-deploy = "hexfellow_deploy.cli:main"
hexfellow-calibrate = "hexfellow_deploy.calibration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
sim = [
  "mujoco==3.10.0", "pin==2.7.0", "hpp-fcl==2.4.4", "pin-pink==4.3.0",
  "qpsolvers==4.12.0", "daqp==0.8.7", "pillow>=9", "opencv-python-headless==4.11.0.86",
  "trimesh>=4,<5", "scipy>=1.10,<2", "imageio-ffmpeg>=0.5,<0.7",
  "matplotlib>=3.8,<3.10",
]
dev = ["pytest>=8"]
hardware = ["hex-device==1.4.10"]
validation = ["matplotlib>=3.8,<3.10"]
benchmark = ["casadi==3.6.7"]
calibration-video = ["av>=16,<17"]

[tool.setuptools.package-data]
hexfellow_deploy = ["sim/assets/**/*", "robotics/calibration/*.html", "robotics/control/*.cpp"]
