[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexfellow-deploy"
version = "0.1.0"
description = "Deploy Anything components and PinkIK qualification for Hexfellow"
requires-python = ">=3.10"
dependencies = ["hydra-core>=1.3,<2", "posix_ipc>=1.1", "numpy>=1.26", "PyYAML>=6", "rich>=13"]

[project.scripts]
hexfellow-deploy = "hexfellow_deploy.cli:main"
hexfellow-calibrate = "hexfellow_deploy.calibration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
hardware = ["hex-device==1.4.10"]
validation = ["matplotlib>=3.8,<3.10"]
calibration-video = ["av>=16,<17"]
